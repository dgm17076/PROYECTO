<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donare | Gestión de Donaciones</title><link rel="stylesheet" href="style.css"></head><body><header><h2>♥ Donare</h2><p>Gestión de donaciones con trazabilidad</p></header><main><section class="card"><h1>Gestor de Donaciones</h1><p>Registra una cuenta, inicia sesión y da seguimiento a tus donaciones.</p></section><div class="grid"><section class="card"><h2>Crear cuenta</h2><input id="rn" placeholder="Nombre completo"><input id="re" placeholder="Correo"><input id="rp" type="password" placeholder="Contraseña (8+ caracteres)"><button onclick="register()">Crear cuenta</button></section><section class="card"><h2>Iniciar sesión</h2><input id="le" placeholder="Correo"><input id="lp" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><button class="secondary" onclick="logout()">Cerrar sesión</button></section></div><section class="card"><h2>Nueva donación</h2><input id="type" placeholder="Tipo: alimentos, ropa..."><textarea id="description" placeholder="Descripción"></textarea><input id="quantity" type="number" min="1" placeholder="Cantidad"><select id="center"></select><button onclick="donate()">Registrar donación</button></section><section class="card"><h2>Donaciones</h2><button class="secondary" onclick="loadDonations()">Actualizar</button><div id="list"></div></section><p id="msg"></p></main><script src="app.js"></script></body></html>
