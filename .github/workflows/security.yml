name: Security - OWASP ZAP

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public deployment
        run: |
          for i in {1..12}; do
            if curl -fsS https://gestor-donaciones.onrender.com/api/health; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://gestor-donaciones.onrender.com'
          allow_issue_writing: false
          artifact_name: zap-security-report
          fail_action: false
